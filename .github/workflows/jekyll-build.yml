name: jekyll-build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_REPO_NWO: cdancette/cdancette.github.io
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JEKYLL_ENV: production
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace

